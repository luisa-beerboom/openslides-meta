fields:
  id:
    type: number
    restriction_mode: A
    constant: true
    required: true
  poll_id:
    type: relation
    to: poll/config_id
    required: true
    restriction_mode: A
  max_options_amount:
    type: number
    default: 0
    restriction_mode: A
  min_options_amount:
    type: number
    default: 0
    restriction_mode: A
  allow_nota:
    type: boolean
    default: false
    restriction_mode: A
  strike_out:
    type: boolean
    default: false
    restriction_mode: A
  onehundred_percent_base:
    type: string
    required: true
    enum: selection_onehundred_percent_bases
    restriction_mode: A
  required_majority:
    type: string
    enum: required_majority
    default: no_majority
    restriction_mode: A
  display_chart:
    type: string
    restriction_mode: A
