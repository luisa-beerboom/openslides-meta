fields:
  id:
    type: number
    restriction_mode: A
    constant: true
    required: true
  title:
    type: string
    required: true
    restriction_mode: A
  config_id:
    type: generic-relation
    to:
      - poll_config_approval/poll_id
      - poll_config_selection/poll_id
      - poll_config_rating_score/poll_id
      - poll_config_rating_approval/poll_id
      - poll_config_stv_scottish/poll_id
    reference:
      - poll_config_approval
      - poll_config_selection
      - poll_config_rating_score
      - poll_config_rating_approval
      - poll_config_stv_scottish
    required: true
    on_delete: CASCADE
    restriction_mode: A
  option_ids:
    type: relation-list
    to: poll_option/poll_id
    on_delete: CASCADE
    restriction_mode: A
  visibility:
    type: string
    required: true
    enum: poll_visibility
    restriction_mode: A
  state:
    type: string
    enum:
      - created
      - started
      - finished
    default: created
    restriction_mode: A
  result:
    type: text
    description: Calculated result. The format depends on the value in poll/method. Can be manually set when visibility is set to manually.
    restriction_mode: B
  published:
    type: boolean
    default: false
    description: If true, users can see the result.
    restriction_mode: A
  anonymized:
    type: boolean
    default: false
    description: Set to true, after finished was called with anonymize.
    restriction_mode: A
  allow_invalid:
    type: boolean
    default: false
    description: If true, the vote service does not validate. This is always the case for secret polls.
    restriction_mode: A
  allow_vote_split:
    type: boolean
    default: false
    description: If true, users can split there vote.
    restriction_mode: A
  live_voting_enabled:
    type: boolean
    default: false
    description: If true, on start, publish will be set to true.
    restriction_mode: A
  sequential_number:
    type: number
    sequence_scope: meeting_id
    description: The (positive) serial number of this model in its meeting. This number is auto-generated and read-only.
    read_only: true
    required: true
    restriction_mode: A
    constant: true
  content_object_id:
    type: generic-relation
    reference:
      - motion
      - assignment
      - topic
    to:
      collections:
        - motion
        - assignment
        - topic
      field: poll_ids
    equal_fields: meeting_id
    restriction_mode: A
    required: true
    constant: true
  ballot_ids:
    type: relation-list
    to: poll_ballot/poll_id
    reference: poll_ballot
    on_delete: CASCADE
    restriction_mode: A
  ballot_user_ids:
    type: relation-list
    to: poll_ballot_user/poll_id
    reference: poll_ballot_user
    on_delete: CASCADE
    restriction_mode: A
  entitled_group_ids:
    type: relation-list
    to: group/poll_ids
    equal_fields: meeting_id
    restriction_mode: A
  entitled_user_ids:
    type: relation-list
    to: poll_entitled_user/poll_id
    on_delete: CASCADE
    restriction_mode: A
  projection_ids:
    type: relation-list
    to: projection/content_object_id
    equal_fields: meeting_id
    on_delete: CASCADE
    restriction_mode: A
  meeting_id:
    type: relation
    reference: meeting
    to: meeting/poll_ids
    restriction_mode: A
    required: true
    constant: true
